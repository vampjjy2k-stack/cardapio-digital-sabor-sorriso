# Cloudflare Pages — Sabor & Sorriso
name = "sabor-sorriso"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"

# Preview is intentionally disconnected from production state.
[env.preview]
kv_namespaces = []

[env.preview.durable_objects]
bindings = []

[[env.production.kv_namespaces]]
binding = "SABOR_SORRISO_KV"
id = "fef8b8c081014ddfa52607faf8ed8080"

[[env.production.durable_objects.bindings]]
name = "ADMIN_LOGIN_LIMITER"
